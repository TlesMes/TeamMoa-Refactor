# 로컬 한계점 탐색 2차 측정 — 앱 멀티프로세스 스택 (2026-09-11)
#
# 1차 측정 결과: Daphne 단일 프로세스가 GIL 때문에 1.27코어에서 포화됐고
# (web CPU 127% 고정) 호스트 CPU는 25~36%에 그쳤다. 무릎이 VU 90~100.
# 한계는 하드웨어가 아니라 배포 구성이었다.
#
# 이 스택은 그 천장을 걷어낸다:
#   - Daphne 컨테이너 6개 (호스트 물리 코어 수)
#   - 앞단에 Nginx (prod 토폴로지와 동일한 형태)
#   - 호스트 포트는 8000 그대로 → 생성기의 TARGET_URL을 바꾸지 않아도 된다
#
# ⚠️ max_connections 를 2000으로 올렸다. 1차에서 커넥션 누수로 301에서
#    500이 터졌는데, 프로세스가 6배면 그 벽에 6배 빨리 닿아 "CPU 천장을
#    걷었을 때 처리량이 어디까지 가는가"를 볼 수 없게 된다. 커넥션을 변수에서
#    빼기 위한 **의도적 조치**이며 리포트에 명시한다.
#    (누수 자체는 별도로 고쳐야 하는 프로덕션 버그다 — FINDINGS.md 참고)

x-web: &web-base
  image: teammoa-web:loadtest
  restart: unless-stopped
  command: daphne -b 0.0.0.0 -p 8000 TeamMoa.asgi:application
  env_file:
    - .env
  environment:
    - DJANGO_SETTINGS_MODULE=TeamMoa.settings.loadtest
    - DB_HOST=db
    - DB_PORT=3306
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=
    - ALLOWED_HOSTS=*
    - SECURE_SSL_REDIRECT=False
    - CORS_ALLOWED_ORIGINS=
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: mysql:8.0
    container_name: teammoa_db_lt
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-teammoa_db}
      MYSQL_USER: ${DB_USER:-teammoa_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-teammoa_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_lt:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=2000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teammoa_redis_lt
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── 앱 프로세스 6개 ──────────────────────────────────────
  # 컨테이너 이름을 teammoa_web_lt1..6 으로 고정한다.
  # 수집기가 이름으로 찾아 CPU/메모리를 합산한다.
  web1:
    <<: *web-base
    container_name: teammoa_web_lt1
  web2:
    <<: *web-base
    container_name: teammoa_web_lt2
  web3:
    <<: *web-base
    container_name: teammoa_web_lt3
  web4:
    <<: *web-base
    container_name: teammoa_web_lt4
  web5:
    <<: *web-base
    container_name: teammoa_web_lt5
  web6:
    <<: *web-base
    container_name: teammoa_web_lt6

  nginx:
    image: nginx:1.25-alpine
    container_name: teammoa_nginx_lt
    restart: unless-stopped
    ports:
      # 1차 측정과 같은 주소를 쓴다. 생성기 설정을 바꿀 필요가 없다.
      - "0.0.0.0:8000:80"
    volumes:
      - ./deploy/nginx-loadtest.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
      - web3
      - web4
      - web5
      - web6
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data_lt:
    name: teammoa_mysql_data_lt
  redis_data_lt:
    name: teammoa_redis_data_lt

networks:
  default:
    name: teammoa_lt_network
