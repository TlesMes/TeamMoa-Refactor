# 병목 확정 실험용 Nginx — 앱 프로세스 3개 (2026-09-11)
#
# 2차(6프로세스)에서 web CPU가 정확히 600%(프로세스당 100%)로 평평했고
# 호스트 CPU는 89%였다. 둘 중 무엇이 진짜 천장인지 구분되지 않는다.
#   - 프로세스별 GIL이 천장이면 → 3개로 줄이면 처리량이 절반이 된다
#   - 호스트 CPU가 천장이면    → 3개로 줄여도 처리량이 크게 안 줄어든다
# 이 파일은 그 대조군이다. upstream 만 3개로 줄였고 나머지는 동일하다.
#
# 1차 측정에서 Daphne 단일 프로세스가 GIL 때문에 1.27코어에서 천장에 닿았다.
# (web CPU 127% 고정, 호스트 CPU는 25~36%로 8코어 이상이 유휴)
# 앱 프로세스를 코어 수만큼 띄우고 그 앞에 이 Nginx를 두어 천장을 걷어낸다.
#
# 프록시가 병목이 되면 안 되므로 worker_connections 와 keepalive 를 넉넉히 잡는다.

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # 부하 측정 중 접근 로그 I/O가 변수로 끼지 않도록 끈다.
    # (1차 측정에서는 Nginx 자체가 없었으므로 조건을 맞추는 쪽이 낫다)
    access_log off;
    error_log /var/log/nginx/error.log warn;

    upstream teammoa_app {
        # least_conn: 요청별 처리 시간 편차가 큰 워크로드라 라운드로빈보다
        # 대기열이 고르게 분산된다.
        least_conn;
        server web1:8000 max_fails=0;
        server web2:8000 max_fails=0;
        server web3:8000 max_fails=0;
        keepalive 256;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server backlog=4096;
        server_name _;

        client_max_body_size 20M;

        # Nginx 자체 생존 확인 (앱을 거치지 않는다)
        location /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://teammoa_app;
            proxy_http_version 1.1;

            # 업스트림 keepalive 를 쓰려면 Connection 헤더를 비워야 한다.
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 포화 구간에서 응답이 10초를 넘긴다. 프록시 타임아웃이 먼저 걸리면
            # 서버 한계가 아니라 프록시 설정을 재게 되므로 넉넉히 잡는다.
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            proxy_buffering on;
            proxy_buffers 16 32k;
            proxy_buffer_size 32k;
        }

        # WebSocket (마인드맵 실시간 협업) — 부하 시나리오에는 없지만
        # 구성이 prod와 어긋나지 않도록 유지한다.
        location /ws/ {
            proxy_pass http://teammoa_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
        }
    }
}
